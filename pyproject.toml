[project]
name = "savviety-instinct"
version = "0.1.0"
description = "Measure what matters. Learn what your team does well. Apply it."
requires-python = ">=3.12"
authors = [{ name = "Savviety" }]
dependencies = [
    "typer>=0.12,<0.13",
    "rich>=13,<14",
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "alembic>=1.13,<2",
    "tree-sitter>=0.22,<0.24",
    "tree-sitter-python==0.23.*",
    "networkx>=3.2,<4",
    "blake3>=1.0,<2",
    "xxhash>=3.4,<4",
]

[project.scripts]
instinct = "savviety_instinct.cli.app:app"
savviety-instinct = "savviety_instinct.cli.app:app"

[dependency-groups]
dev = [
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6,<7",
    "pre-commit>=3,<5",
]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/savviety_instinct"]

[tool.uv]
# Install dev + test groups by default. Without this, `uv sync` installs
# only `dev` and `uv run pytest` fails with "pytest: command not found".
default-groups = ["dev", "test"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["tests/fixtures/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["tests/fixtures/"]

[[tool.mypy.overrides]]
module = [
    "savviety_instinct.core.*",
    "savviety_instinct.storage.*",
]
strict = true

[[tool.mypy.overrides]]
module = ["tree_sitter.*", "tree_sitter_python"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=savviety_instinct --cov-report=term-missing"

[tool.coverage.run]
source = ["savviety_instinct"]
branch = true

[tool.coverage.report]
show_missing = true
